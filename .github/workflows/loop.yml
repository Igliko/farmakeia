name: Αυτόματη ενημέρωση (συνεχής)

# Το «schedule» του GitHub σε καινούργια repos τρέχει πολύ σπάνια.
# Γι' αυτό αυτή η εργασία τρέχει ~5 ώρες, ενημερώνει μόνη της, και στο τέλος ξεκινάει την επόμενη.
#   - Πάτρα: κάθε 15 λεπτά
#   - Υπόλοιπη Ελλάδα: κάθε 2 ώρες ένα κομμάτι των περιοχών
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/loop.yml"]
  schedule:
    - cron: "17 */6 * * *"   # εφεδρεία, αν κάποια στιγμή σταματήσει η αλυσίδα

permissions:
  contents: write
  actions: write

concurrency:
  group: loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Ενημέρωση σε επανάληψη
        env:
          TIME_BUDGET_MIN: "40"
        run: |
          git config user.name "farmakeia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          save() {
            git add data/
            if git diff --cached --quiet; then return 0; fi
            git commit -q -m "$1 $(TZ=Europe/Athens date '+%d/%m %H:%M')"
            for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && return 0; sleep 7; done
          }
          end=$(( $(date +%s) + 300*60 ))
          # Η Ελλάδα κάθε 2 ώρες, μετρώντας από την τελευταία φορά που έτρεξε (γράφεται στο data/cursor.json),
          # όχι από την αρχή αυτής της εργασίας: έτσι δεν χάνεται χρόνος κάθε φορά που ξαναρχίζει η αλυσίδα.
          last_gr=$(TZ=Europe/Athens date -d "$(node -p "require('./data/cursor.json').at" 2>/dev/null)" +%s 2>/dev/null || date +%s)
          node scripts/osm.mjs || echo "OpenStreetMap απέτυχε αυτή τη φορά"   # μία φορά την εβδομάδα (αλλιώς δεν κάνει τίποτα)
          (pip install -q duckdb && python3 scripts/overture.py && node scripts/merge.mjs) || echo "Overture απέτυχε αυτή τη φορά"   # κι αυτό μία φορά την εβδομάδα
          save "Όλα τα φαρμακεία:"
          while [ "$(date +%s)" -lt "$end" ]; do
            git pull -q --rebase -X theirs origin main || true
            node scripts/update.mjs || echo "Η Πάτρα απέτυχε αυτή τη φορά"
            save "Εφημερίες: ενημέρωση"
            now=$(date +%s)
            if [ $(( now - last_gr )) -ge 7000 ] && [ $(( end - now )) -ge 2700 ]; then
              node scripts/greece.mjs || echo "Η Ελλάδα απέτυχε αυτή τη φορά"
              save "Ελλάδα: ενημέρωση"
              last_gr=$now
            fi
            sleep 900
          done
      - name: Ξεκίνα την επόμενη
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run loop.yml --repo "$GITHUB_REPOSITORY" --ref main
