name: Όλα τα φαρμακεία (OpenStreetMap)

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/osm.yml"]

permissions:
  contents: write

jobs:
  osm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Κατέβασε όλα τα φαρμακεία από το OpenStreetMap
        env:
          FORCE: "1"
        run: node scripts/osm.mjs
      - name: Αποθήκευσε
        run: |
          git config user.name "farmakeia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm.json
          git diff --cached --quiet || git commit -q -m "Φαρμακεία: νέα δεδομένα από OpenStreetMap"
          # πάρε ό,τι άλλαξε στο μεταξύ και ξαναένωσε πάνω στα πιο φρέσκα δεδομένα
          for i in 1 2 3 4 5; do
            git pull -q --rebase -X theirs origin main || { sleep 7; continue; }
            node scripts/merge.mjs
            git add data/all.json
            git diff --cached --quiet || git commit -q -m "Όλα τα φαρμακεία: OpenStreetMap + Overture Maps"
            git push -q && exit 0
            sleep 7
          done
          exit 1
