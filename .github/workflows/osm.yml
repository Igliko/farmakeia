name: Όλα τα φαρμακεία (OpenStreetMap)

on:
  workflow_dispatch:
  push:
    paths: ["scripts/osm.mjs", ".github/workflows/osm.yml"]

permissions:
  contents: write

jobs:
  osm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Κατέβασε όλα τα φαρμακεία από το OpenStreetMap
        env:
          FORCE: "1"
        run: node scripts/osm.mjs
      - name: Αποθήκευσε
        run: |
          git config user.name "farmakeia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/all.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Όλα τα φαρμακεία: ενημέρωση από OpenStreetMap"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && exit 0; sleep 7; done
          exit 1
