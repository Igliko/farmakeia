name: Όλα τα φαρμακεία (Overture Maps)

on:
  workflow_dispatch:
  push:
    paths: ["scripts/overture.py", "scripts/merge.mjs", ".github/workflows/places.yml"]

permissions:
  contents: write

concurrency:
  group: places
  cancel-in-progress: false

jobs:
  places:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Κατέβασε τα φαρμακεία από το Overture Maps
        env:
          FORCE: "1"
          DIAG: "1"
        run: |
          pip install -q duckdb
          python3 scripts/overture.py
      - name: Αποθήκευσε
        run: |
          git config user.name "farmakeia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/overture.json
          git diff --cached --quiet || git commit -q -m "Φαρμακεία: νέα δεδομένα από Overture Maps"
          # πάρε ό,τι άλλαξε στο μεταξύ και ξαναένωσε πάνω στα πιο φρέσκα δεδομένα
          for i in 1 2 3 4 5; do
            git pull -q --rebase -X theirs origin main || { sleep 7; continue; }
            node scripts/merge.mjs
            git add data/all.json
            git diff --cached --quiet || git commit -q -m "Όλα τα φαρμακεία: OpenStreetMap + Overture Maps"
            git push -q && exit 0
            sleep 7
          done
          exit 1
