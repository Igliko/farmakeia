name: Ενημέρωση εφημεριών

on:
  # τρέχει πλέον μέσα από το loop.yml· εδώ μόνο χειροκίνητα
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Διάβασε το vrisko.gr
        run: node scripts/update.mjs
      - name: Αποθήκευσε αν άλλαξε κάτι
        run: |
          git config user.name "farmakeia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Καμία αλλαγή."
          else
            git commit -m "Εφημερίες: ενημέρωση $(TZ=Europe/Athens date '+%d/%m %H:%M')"
            for i in 1 2 3 4 5; do git pull --rebase origin main && git push && exit 0; sleep 7; done
            exit 1
          fi
