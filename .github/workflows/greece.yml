name: Εφημερίες όλης της Ελλάδας

on:
  schedule:
    # ώρα UTC: 05:20, 10:20, 15:20 (Ελλάδα 07:20 / 12:20 / 17:20 τον χειμώνα)
    - cron: "20 4,7,10,13,16 * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/greece.mjs", "scripts/net.mjs", "scripts/parse.mjs", ".github/workflows/greece.yml"]

permissions:
  contents: write

concurrency:
  group: update-greece
  cancel-in-progress: false

jobs:
  greece:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Διάβασε όλη την Ελλάδα από το vrisko.gr
        env:
          TIME_BUDGET_MIN: "40"
        run: node scripts/greece.mjs
      - name: Αποθήκευσε
        run: |
          git config user.name "farmakeia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Καμία αλλαγή."; exit 0; fi
          git commit -m "Ελλάδα: ενημέρωση $(TZ=Europe/Athens date '+%d/%m %H:%M')"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 10
          done
          exit 1
