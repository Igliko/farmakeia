name: Telegram bot (έλεγχος)
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/bot-check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Τι λέει το Telegram για το bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          T=$(printf '%s' "$TELEGRAM_TOKEN" | tr -d '[:space:]')
          echo "WEBHOOK: $(curl -sS "https://api.telegram.org/bot$T/getWebhookInfo" | sed "s/$T/***/g")"
          echo "WORKER GET: $(curl -sS -m 10 https://farmakeia-bot.kociaj4.workers.dev/ | head -c 200)"
          echo "WORKER POST (χωρίς κωδικό, πρέπει 403): $(curl -sS -m 10 -o /dev/null -w '%{http_code}' -X POST https://farmakeia-bot.kociaj4.workers.dev/telegram -d '{}')"
