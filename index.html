<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Εφημερίες Φαρμακείων</title>
<meta name="description" content="Ποια φαρμακεία είναι ανοιχτά τώρα σε όλη την Ελλάδα: εφημερεύοντα και διευρυμένου ωραρίου, σε χάρτη.">
<meta name="theme-color" content="#0B0C0E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2307794D'/%3E%3Cpath d='M13 6h6v7h7v6h-7v7h-6v-7H6v-6h7z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&family=Fira+Sans+Extra+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" rel="stylesheet">
<style>
/* Χάρτης σε όλη την οθόνη, φύλλο με τη λίστα από κάτω (κινητό) ή αριστερά (υπολογιστής) */
:root{
  --bg:#E8ECE7;--card:#FFFFFF;--fg:#10241B;--muted:#52635B;--line:#E3E9E5;--soft:#EEF2EF;
  --green:#07794D;--greenSoft:#E3F3EA;--bar:#5FB98C;--amber:#A35400;--amberSoft:#FBEEDD;--blue:#2563EB;--onGreen:#FFFFFF;
  --shadow:rgba(16,36,27,.16);--display:'Fira Sans Extra Condensed','Arial Narrow',sans-serif;--body:Commissioner,'Segoe UI',Roboto,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{
  --bg:#121C18;--card:#121D19;--fg:#E6F0EB;--muted:#9AB0A6;--line:#22322B;--soft:#1A2722;
  --green:#3DDC97;--greenSoft:rgba(61,220,151,.12);--bar:#2E8A62;--amber:#F2A65A;--amberSoft:rgba(242,166,90,.13);--blue:#4C8DFF;--onGreen:#062014;
  --shadow:rgba(0,0,0,.45);color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#map{position:fixed;inset:0}

.top{position:fixed;z-index:6;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.brand,.fab{pointer-events:auto;background:var(--card);box-shadow:0 6px 18px var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:16px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--green);display:grid;place-items:center;flex:none}
.logo path{fill:var(--onGreen)}
h1{margin:0;font:700 19px/1.1 var(--display);letter-spacing:.2px}
.sub{margin:2px 0 0;font:500 12.5px/1.2 var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.fabs{display:flex;flex-direction:column;gap:10px}
.fab{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer}
.fab.loc{color:var(--blue)}

.sheet{position:fixed;z-index:5;left:0;right:0;bottom:0;height:46vh;min-height:300px;display:flex;flex-direction:column;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px var(--shadow);transition:height .25s ease}
.sheet.tall{height:82vh}
.sheet.low{height:min(175px,30vh);min-height:0}
.handle{flex:none;border:0;background:none;padding:14px 0 10px;cursor:grab;display:grid;place-items:center;touch-action:none}
.sheet .head{touch-action:none}
.handle i{width:38px;height:4px;border-radius:2px;background:var(--line);display:block}
.head{flex:none;padding:0 max(18px,env(safe-area-inset-right,0px)) 8px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.styles{position:fixed;z-index:6;top:calc(80px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:70px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.styles button{flex:none;height:36px;padding:0 13px;border:0;border-radius:999px;background:var(--card);color:var(--fg);font:600 13.5px/1 var(--body);box-shadow:0 3px 10px var(--shadow);cursor:pointer}
.styles button[aria-pressed="true"]{background:var(--green);color:var(--onGreen)}
.search{position:relative;display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:12px;background:var(--soft);color:var(--muted)}
.search input{flex:1;min-width:0;height:100%;border:0;background:transparent;color:var(--fg);font:500 16px/1 var(--body);outline:none}
.search:focus-within{outline:3px solid var(--blue);outline-offset:1px}
.results{position:absolute;left:0;right:0;top:48px;z-index:10;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px var(--shadow);overflow:hidden}
.results button{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.results button:first-child{border-top:0}
.results button:hover,.results button:focus-visible{background:var(--soft)}
.results b{font:600 15px/1.2 var(--body)}
.results span{font:500 12.5px/1.2 var(--body);color:var(--muted)}
.nores{margin:0;padding:12px 14px;font:500 14px/1.3 var(--body);color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;background:var(--soft);border-radius:12px}
.tabs button{height:36px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:600 14.5px/1 var(--body);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px var(--shadow)}
.sum{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.big{margin:0;font:700 26px/1.05 var(--display)}
.small{margin:4px 0 0;font:500 14px/1.3 var(--body);color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--greenSoft);color:var(--green);font:600 12px/1 var(--body);white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.group{margin:14px 0 2px;font:600 11.5px/1 var(--body);letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}

.item{border-top:1px solid var(--line);padding:12px 0}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:0;border:0;background:none;text-align:left;cursor:pointer}
.ic{flex:none;width:32px;height:32px;border-radius:9px;background:var(--green);display:grid;place-items:center}
.ic path{fill:var(--onGreen)}
.ic.later{background:var(--amberSoft)} .ic.later path{fill:var(--amber)}
.ic.off{background:var(--soft)} .ic.off path{fill:var(--muted)}
.mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.name{font:600 16px/1.25 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font:600 13.5px/1.25 var(--body)}
.kind{font:500 12.5px/1.2 var(--body);color:var(--muted)}
.dist{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.dist b{font:700 18px/1 var(--display);font-variant-numeric:tabular-nums}
.dist span{font:500 12px/1.2 var(--body);color:var(--muted)}
.more{display:none;flex-direction:column;gap:10px;padding:10px 0 0 44px}
.item.on .more{display:flex}
.addr{margin:0;font:500 14px/1.45 var(--body);color:var(--muted)}
.btns{display:flex;gap:8px}
.btns a{flex:1;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font:600 15px/1 var(--body);text-decoration:none}
.call{background:var(--green);color:var(--onGreen)}
.dir{border:1.5px solid var(--line);color:var(--fg)}
.phone{font:500 13px/1.3 var(--body);color:var(--muted);font-variant-numeric:tabular-nums;user-select:all}

.tl{position:relative;height:8px;border-radius:4px;background:var(--soft);margin-top:8px}
.tl span{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--bar)}
.tl span.duty{background:var(--green)}
.tl .now{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--fg);opacity:.55}
.ticks{position:relative;height:14px;margin-top:10px;font:500 11px/1 var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.ticks span{position:absolute;transform:translateX(-50%)}
.ticks span:first-child{transform:none}.ticks span:last-child{transform:translateX(-100%)}
.empty{padding:26px 8px;text-align:center;color:var(--muted);font:500 14px/1.5 var(--body)}
.empty b{display:block;color:var(--fg);font:600 16px/1.3 var(--body);margin-bottom:6px}
.note{margin:16px 0 0;font:500 12.5px/1.5 var(--body);color:var(--muted)}
.note a{color:inherit}

.pin{width:34px;height:34px;border-radius:11px;border:2.5px solid #fff;background:#07794D;display:grid;place-items:center;padding:0;cursor:pointer;box-shadow:0 0 0 5px rgba(18,164,100,.22),0 4px 10px rgba(0,0,0,.3);transition:transform .15s}
.pin path{fill:#fff}
.pin.later{background:#A35400;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.pin.off{background:#7D8C85;box-shadow:0 4px 10px rgba(0,0,0,.25);transform:scale(.8)}
.pin.on{transform:scale(1.25);z-index:3}
.me{width:16px;height:16px;border-radius:50%;background:#2563EB;border:3px solid #fff;box-shadow:0 0 0 12px rgba(37,99,235,.15)}
.maplibregl-ctrl-attrib{font-size:10px}
.maplibregl-ctrl-bottom-right{bottom:calc(46vh - 8px)}

@media (min-width:860px){
  .sheet,.sheet.tall,.sheet.low{top:calc(84px + env(safe-area-inset-top,0px));left:12px;right:auto;bottom:12px;width:400px;height:auto;min-height:0;border-radius:20px}
  .handle{display:none}.head{padding-top:16px}
  .maplibregl-ctrl-bottom-right{bottom:0}
}
@media (prefers-reduced-motion:reduce){.sheet,.pin{transition:none}}

/* ===== Σχέδια (δοκιμή) : html[data-d] ===== */
@media (min-width:860px){
  html[data-d] .top{left:0;right:max(16px,env(safe-area-inset-right,0px));top:0}
  html[data-d] .brand{position:fixed;left:0;top:0;width:420px;border-radius:0;box-shadow:none;padding:16px 20px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
  html[data-d] .fabs{position:fixed;top:16px;right:max(16px,env(safe-area-inset-right,0px))}
  html[data-d] .sheet,html[data-d] .sheet.tall,html[data-d] .sheet.low{top:67px;left:0;bottom:0;width:420px;border-radius:0;box-shadow:none;border-right:1px solid var(--line)}
  html[data-d] .styles{left:436px;top:16px}
}
html[data-d] .head{gap:10px}
html[data-d] .tabs{background:none;border-radius:0;padding:0;gap:0;border-bottom:1px solid var(--line)}
html[data-d] .tabs button{border-radius:0;height:42px;background:none;box-shadow:none}
html[data-d] .tabs button[aria-selected="true"]{background:none;box-shadow:inset 0 -2px 0 var(--fg);color:var(--fg)}
html[data-d] .live{background:none;padding:0}
html[data-d] .ic{width:10px;height:10px;border-radius:50%;margin:0 4px}
html[data-d] .ic svg{display:none}
html[data-d] .ic.later{background:var(--amber)} html[data-d] .ic.off{background:var(--line)}
html[data-d] .item .more{padding-left:26px}
html[data-d] .item{padding:14px 0}

/* Α · Καθαρό */
html[data-d="clean"]{--bg:#F5F5F3;--card:#FFFFFF;--fg:#151515;--muted:#5F6368;--line:#E4E4E1;--soft:#F1F1EE;--green:#0B7A3E;--greenSoft:#E6F2EA;--amber:#B25E00;--blue:#1A56DB;--onGreen:#fff;--shadow:rgba(0,0,0,.08);
  --display:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:light}
html[data-d="clean"] h1{font:600 17px/1.2 var(--body);letter-spacing:0}
html[data-d="clean"] .logo{width:28px;height:28px;border-radius:6px}
html[data-d="clean"] .big{font:600 22px/1.2 var(--body)}
html[data-d="clean"] .name{font:600 15px/1.3 var(--body)}
html[data-d="clean"] .dist b{font:600 15px/1 var(--body)}
html[data-d="clean"] .search{background:#fff;border:1px solid var(--line);border-radius:8px}
html[data-d="clean"] .btns a{border-radius:8px;height:40px;font:600 14px/1 var(--body)}
html[data-d="clean"] .fab{border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.15),0 0 0 1px var(--line)}
html[data-d="clean"] .group{letter-spacing:.6px}

/* Β · Σκούρο */
html[data-d="dark"]{--bg:#0B0C0E;--card:#111214;--fg:#EDEDEF;--muted:#8A8F98;--line:#222428;--soft:#17181B;--green:#4ADE80;--greenSoft:rgba(74,222,128,.1);--bar:#2F8F57;--amber:#F5A524;--amberSoft:rgba(245,165,36,.12);--blue:#7AA2FF;--onGreen:#04140A;--shadow:rgba(0,0,0,.5);
  --display:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:dark}
html[data-d="dark"] h1{font:600 16px/1.2 var(--body);letter-spacing:-.1px}
html[data-d="dark"] .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(180deg,#5BE58F,#2FB96A)}
html[data-d="dark"] .big{font:600 26px/1.15 var(--body);letter-spacing:-.4px}
html[data-d="dark"] .name{font:500 15px/1.3 var(--body)}
html[data-d="dark"] .st{font:500 13px/1.3 var(--body)}
html[data-d="dark"] .dist b{font:500 15px/1 var(--body)}
html[data-d="dark"] .ic{box-shadow:0 0 10px var(--green)}
html[data-d="dark"] .ic.later,html[data-d="dark"] .ic.off{box-shadow:none}
html[data-d="dark"] .search{background:var(--soft);border:1px solid var(--line);border-radius:8px}
html[data-d="dark"] .item{border-top-color:var(--line)}
html[data-d="dark"] .item:hover{background:rgba(255,255,255,.02)}
html[data-d="dark"] .btns a{border-radius:7px;height:38px;font:500 14px/1 var(--body)}
html[data-d="dark"] .dir{border:1px solid var(--line)}
html[data-d="dark"] .fab{border-radius:8px;background:var(--card);box-shadow:0 0 0 1px var(--line)}

/* Γ · Έντονο (neo-brutal) */
html[data-d="bold"]{--bg:#FFFDF6;--card:#FFFDF6;--fg:#0A0A0A;--muted:#3B3B3B;--line:#0A0A0A;--soft:#F1EEE2;--green:#00C065;--greenSoft:#C9F7DD;--bar:#00C065;--amber:#FF8A00;--amberSoft:#FFE2BF;--blue:#2B4BFF;--onGreen:#0A0A0A;--shadow:transparent;
  --display:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:light}
html[data-d="bold"] .brand,html[data-d="bold"] .sheet{border-width:2px!important;border-color:#0A0A0A!important}
html[data-d="bold"] h1{font:800 20px/1.1 var(--body);text-transform:uppercase;letter-spacing:.3px}
html[data-d="bold"] .logo{border-radius:0;border:2px solid #0A0A0A}
html[data-d="bold"] .big{font:800 30px/1.05 var(--body);letter-spacing:-.5px}
html[data-d="bold"] .name{font:700 16px/1.3 var(--body)}
html[data-d="bold"] .st{color:var(--fg)!important;font:600 13.5px/1.3 var(--body)}
html[data-d="bold"] .ic{width:14px;height:14px;border-radius:0;border:2px solid #0A0A0A}
html[data-d="bold"] .item{border-top:2px solid #0A0A0A}
html[data-d="bold"] .tabs{border:2px solid #0A0A0A;border-bottom-width:2px}
html[data-d="bold"] .tabs button{font-weight:800;text-transform:uppercase;letter-spacing:.5px}
html[data-d="bold"] .tabs button+button{border-left:2px solid #0A0A0A}
html[data-d="bold"] .tabs button[aria-selected="true"]{background:var(--green);box-shadow:none}
html[data-d="bold"] .search{background:#fff;border:2px solid #0A0A0A;border-radius:0;box-shadow:3px 3px 0 #0A0A0A}
html[data-d="bold"] .btns a{border-radius:0;border:2px solid #0A0A0A;box-shadow:3px 3px 0 #0A0A0A;font:800 14px/1 var(--body);text-transform:uppercase}
html[data-d="bold"] .call{background:var(--green);color:#0A0A0A}
html[data-d="bold"] .fab{border-radius:0;background:#fff;border:2px solid #0A0A0A;box-shadow:3px 3px 0 #0A0A0A}
html[data-d="bold"] .live{color:#0A0A0A;font-weight:800}
html[data-d="bold"] .live i{background:var(--green);border:1.5px solid #0A0A0A;width:9px;height:9px}
html[data-d="bold"] .styles button{border-radius:0;border:2px solid #0A0A0A;box-shadow:none}
html[data-d="dark"] .maplibregl-ctrl-group{background:var(--card);box-shadow:0 0 0 1px var(--line)}
html[data-d="dark"] .maplibregl-ctrl-group button+button{border-top-color:var(--line)}
html[data-d="dark"] .maplibregl-ctrl-group .maplibregl-ctrl-icon{filter:invert(1) brightness(.9)}
html[data-d="dark"] .maplibregl-ctrl-attrib{background:rgba(17,18,20,.8);color:var(--muted)}
html[data-d="dark"] .maplibregl-ctrl-attrib a{color:var(--muted)}
.legend{position:fixed;z-index:4;right:56px;bottom:calc(46vh + 10px);display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:8px;background:rgba(17,18,20,.88);border:1px solid var(--line);color:var(--muted);font:500 12px/1.2 var(--body)}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:11px;height:11px;border-radius:50%;border:1.5px solid #0B0C0E;display:inline-block;flex:none}
.legend i.sm{width:7px;height:7px;margin:0 2px}
@media (min-width:860px){.legend{bottom:20px;right:60px}}
.reach{font:600 12.5px/1.3 var(--body)}
.reach.ok{color:var(--green)}
.reach.no{color:#F87171}
.mode{display:flex;gap:6px}
.mode button{flex:1;height:32px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--muted);font:500 13px/1 var(--body);cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--soft);color:var(--fg);border-color:var(--muted)}
</style>
</head>
<body>
<div id="map" role="region" aria-label="Χάρτης με τα φαρμακεία"></div>

<div class="top">
  <div class="brand">
    <div class="logo"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M6.5 1h5v5.5H17v5h-5.5V17h-5v-5.5H1v-5h5.5z"/></svg></div>
    <div><h1>Εφημερίες Φαρμακείων</h1><p class="sub" id="clock">&nbsp;</p></div>
  </div>
  <div class="fabs">
    <button class="fab loc" id="locate" aria-label="Η θέση μου"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg></button>
    <button class="fab" id="fit" aria-label="Δείξε τα κοντινά ανοιχτά φαρμακεία"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
  </div>
</div>

<div class="legend" aria-label="Υπόμνημα">
  <span><i style="background:#07794D"></i>Εφημερεύει · ανοιχτό τώρα</span>
  <span><i style="background:#A35400"></i>Εφημερεύει · ανοίγει αργότερα</span>
  <span><i class="sm" style="background:#B4B8BE"></i>Κανονικό ωράριο</span>
</div>

<section class="sheet" id="sheet" aria-label="Φαρμακεία">
  <button class="handle" id="handle" aria-label="Μεγάλωσε ή μίκρυνε τη λίστα"><i></i></button>
  <div class="head">
    <form class="search" id="search" role="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="q" type="search" placeholder="Ψάξε πόλη, π.χ. Αίγιο" autocomplete="off" aria-label="Ψάξε πόλη">
      <div class="results" id="results" hidden></div>
    </form>
    <div class="tabs" role="tablist" aria-label="Πότε">
      <button role="tab" data-view="now" aria-selected="true">Τώρα</button>
      <button role="tab" data-view="today" aria-selected="false">Σήμερα</button>
      <button role="tab" data-view="tomorrow" aria-selected="false">Αύριο</button>
    </div>
    <div class="sum">
      <div><p class="big" id="big">Φόρτωση…</p><p class="small" id="small">&nbsp;</p></div>
      <span class="live" id="live"><i></i>Ζωντανά</span>
    </div>
    <div class="mode" id="mode" role="group" aria-label="Πώς θα πας" hidden>
      <button type="button" data-m="walk">Με τα πόδια</button>
      <button type="button" data-m="car">Με αμάξι</button>
    </div>
  </div>
  <div class="scroll" id="scroll">
    <div id="list"></div>
    <p class="note">Πηγή: <a href="https://www.vrisko.gr/efimeries-farmakeion/patra/" target="_blank" rel="noopener">vrisko.gr</a> (Φαρμακευτικοί Σύλλογοι) · όλα τα φαρμακεία: © OpenStreetMap · τελευταία αλλαγή <span id="upd">–</span>.<br>Οι εφημερίες αλλάζουν καμιά φορά τελευταία στιγμή. Πάρε τηλέφωνο πριν πας.</p>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script>
const CROSS = s => `<svg width="${s}" height="${s}" viewBox="0 0 18 18" aria-hidden="true"><path d="M6.5 1h5v5.5H17v5h-5.5V17h-5v-5.5H1v-5h5.5z"/></svg>`;
const $ = id => document.getElementById(id);
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
const state = { data: null, view: 'now', sel: null, me: null, reg: [] };
const markers = new Map();

// ---- χρόνος (ώρα Ελλάδας) ----
function athensParts(d = new Date()) {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Athens', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(d).map(x => [x.type, x.value]));
  return p;
}
const nowStr = () => { const p = athensParts(); return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`; };
const pad = n => String(n).padStart(2, '0');
function addDays(ymd, k) { const [y, m, d] = ymd.split('-').map(Number); const t = new Date(Date.UTC(y, m - 1, d + k)); return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}-${pad(t.getUTCDate())}`; }
const mins = s => { const [d, t] = s.split('T'); const [y, m, dd] = d.split('-').map(Number); const [h, mi] = t.split(':').map(Number); return Date.UTC(y, m - 1, dd, h, mi) / 60000; };
const hhmm = s => s.slice(11, 16);
const dayName = ymd => { const [y, m, d] = ymd.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('el-GR', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }); };
function dur(m) { if (m < 60) return m + '′'; const h = Math.floor(m / 60), r = m % 60; return h + (h === 1 ? ' ώρα' : ' ώρες') + (r ? ' ' + r + '′' : ''); }
function slotLabel(s) { return hhmm(s.from) + ' – ' + hhmm(s.to) + (s.to.slice(0, 10) > s.from.slice(0, 10) ? ' (επόμενης)' : ''); }

// Κατάσταση ενός φαρμακείου τώρα
function status(p) {
  if (p.reg) return regStatus();
  const n = nowStr(), nm = mins(n);
  const cur = p.slots.filter(s => s.from <= n && n < s.to).sort((a, b) => b.to.localeCompare(a.to))[0];
  if (cur) {
    const left = mins(cur.to) - nm;
    return { k: 'open', slot: cur, text: left <= 60 ? `Κλείνει σε ${left}′ · ${hhmm(cur.to)}` : `Ανοιχτό ως ${hhmm(cur.to)}`, color: left <= 60 ? 'var(--amber)' : 'var(--green)', left };
  }
  const next = p.slots.filter(s => s.from > n).sort((a, b) => a.from.localeCompare(b.from))[0];
  if (next) {
    const inM = mins(next.from) - nm;
    const when = next.from.slice(0, 10) === n.slice(0, 10) ? hhmm(next.from) : (next.from.slice(0, 10) === addDays(n.slice(0, 10), 1) ? 'αύριο ' + hhmm(next.from) : hhmm(next.from));
    return { k: 'later', slot: next, text: inM <= 90 ? `Ανοίγει σε ${inM}′ · ${hhmm(next.from)}` : `Ανοίγει ${when}`, color: 'var(--amber)', inM };
  }
  return { k: 'off', text: 'Έκλεισε', color: 'var(--muted)' };
}
const kindOf = s => s && s.type === 'extended' ? 'Διευρυμένο ωράριο' : 'Εφημερία';

// Συνηθισμένο ωράριο φαρμακείων (χωρίς αργίες): Δευ/Τετ 08:00–14:30, Τρι/Πεμ/Παρ 08:00–14:00 & 17:30–21:00, Σαβ/Κυρ κλειστά
const REG = { 1: [[480, 870]], 2: [[480, 840], [1050, 1260]], 3: [[480, 870]], 4: [[480, 840], [1050, 1260]], 5: [[480, 840], [1050, 1260]], 6: [], 0: [] };
const fmt = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
function regStatus() {
  const n = nowStr(); const [y, mo, d] = n.slice(0, 10).split('-').map(Number);
  const wd = new Date(Date.UTC(y, mo - 1, d)).getUTCDay(), nm = +n.slice(11, 13) * 60 + +n.slice(14, 16);
  const cur = REG[wd].find(([a, b]) => nm >= a && nm < b);
  if (cur) { const left = cur[1] - nm; return { k: 'open', reg: true, text: (left <= 60 ? `Κλείνει σε ${left}′ · ` : 'Ανοιχτό ως ') + fmt(cur[1]), color: left <= 60 ? 'var(--amber)' : 'var(--green)', left }; }
  const nx = REG[wd].find(([a]) => a > nm);
  if (nx) return { k: 'later', reg: true, text: 'Ανοίγει ' + fmt(nx[0]), color: 'var(--muted)', inM: nx[0] - nm };
  return { k: 'off', reg: true, text: 'Κλειστό τώρα', color: 'var(--muted)' };
}

// ---- απόσταση ----
function km(a, b) { const R = 6371, t = x => x * Math.PI / 180, dl = t(b[0] - a[0]), dn = t(b[1] - a[1]); const h = Math.sin(dl / 2) ** 2 + Math.cos(t(a[0])) * Math.cos(t(b[0])) * Math.sin(dn / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }
function dist(p) {
  if (!state.me || p.lat == null) return null;
  const d = km(state.me, [p.lat, p.lng]) * 1.3; // περίπου, με τους δρόμους
  return { d, text: d < 1 ? Math.round(d * 100) * 10 + ' μ.' : d.toFixed(1).replace('.', ',') + ' χλμ', walk: mode === 'walk' ? Math.max(1, Math.ceil(d * 1000 / 80)) + '′ με τα πόδια' : Math.max(3, Math.ceil(d * 2.4 + 2)) + '′ με αμάξι' };
}
// «Θα το προλάβω;» — πόσο θες να φτάσεις και αν θα είναι ακόμα ανοιχτό
let mode = 'walk';
try { if (localStorage.getItem('mode') === 'car') mode = 'car'; } catch (e) {}
function travelMin(p) { const d = dist(p); if (!d) return null; return mode === 'walk' ? Math.max(1, Math.ceil(d.d * 1000 / 80)) : Math.max(3, Math.ceil(d.d * 2.4 + 2)); }
function reach(p, st) {
  if (!state.me || !st || st.k !== 'open' || st.left == null) return null;
  const t = travelMin(p); if (t == null) return null;
  const n = nowStr(), nm = +n.slice(11, 13) * 60 + +n.slice(14, 16);
  return { ok: t <= st.left - 3, t, left: st.left, arrive: fmt((nm + t) % 1440) };
}
const short = n => { const m = n.match(/\(([^)]+)\)\s*$/); const s = m ? m[1] : n; return s.trim().split(/\s+/)[0].replace(/^./, c => c).toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase()); };

// ---- λίστα ----
function card(p, st, extra) {
  const d = dist(p);
  const el = document.createElement('article');
  el.className = 'item' + (p === state.sel ? ' on' : '');
  el.dataset.id = p.id;
  const ic = st.k === 'open' ? '' : st.k === 'later' ? ' later' : ' off';
  el.innerHTML = `<button class="row" aria-expanded="${p === state.sel}">
      <span class="ic${ic}">${CROSS(15)}</span>
      <span class="mid"><span class="name"></span><span class="st" style="color:${st.color}"></span><span class="reach" hidden></span><span class="kind"></span></span>
      <span class="dist"><b>${d ? d.text : ''}</b><span>${d ? d.walk : ''}</span></span>
    </button>
    ${extra || ''}
    <div class="more"><p class="addr"></p>
      <div class="btns">
        <a class="call" href="tel:+30${p.phone}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.8 2z"/></svg>Κλήση</a>
        <a class="dir" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat != null ? p.lat + ',' + p.lng : encodeURIComponent(p.address + ', ' + p.zip + ' ' + (p.town || ''))}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>Οδηγίες</a>
      </div>
      <span class="phone"></span>
    </div>`;
  el.querySelector('.name').textContent = p.name;
  el.querySelector('.st').textContent = st.text;
  const r = reach(p, st), re = el.querySelector('.reach');
  if (r) {
    re.hidden = false; re.className = 'reach ' + (r.ok ? 'ok' : 'no');
    re.textContent = r.ok ? `✓ Προλαβαίνεις · φτάνεις ${r.arrive}, σε ${r.t}′` : `✕ Δεν προλαβαίνεις · φτάνεις σε ${r.t}′, κλείνει σε ${r.left}′`;
  }
  el.querySelector('.kind').textContent = p.reg ? 'Κανονικό ωράριο (το συνηθισμένο, όχι επιβεβαιωμένο)' : kindOf(st.slot) + (st.slot ? ' · ' + slotLabel(st.slot) : '');
  el.querySelector('.addr').textContent = [p.address, p.area && p.area !== p.town ? p.area : '', (p.zip ? p.zip + ' ' : '') + (p.town || '')].filter(Boolean).join(', ') + (p.ap ? ' · θέση στον χάρτη κατά προσέγγιση' : '');
  el.querySelector('.phone').textContent = p.phone ? 'Τηλ. ' + p.phone.replace(/^(\d{4})(\d+)/, '$1 $2') : 'Δεν υπάρχει τηλέφωνο';
  if (!p.phone) el.querySelector('.call').remove();
  if (p.oh) el.querySelector('.addr').textContent += ' · Ωράριο στο OpenStreetMap: ' + p.oh;
  el.querySelector('.row').onclick = () => select(p === state.sel ? null : p, true);
  return el;
}

function timeline(p, day) {
  // κλίμακα 08:00 της ημέρας -> 08:00 της επόμενης
  const a = mins(day + 'T08:00'), W = 24 * 60, n = mins(nowStr());
  const bars = p.slots.map(s => {
    const x0 = Math.max(0, mins(s.from) - a), x1 = Math.min(W, mins(s.to) - a);
    return x1 > x0 ? `<span class="${s.type === 'duty' ? 'duty' : ''}" style="left:${x0 / W * 100}%;width:${(x1 - x0) / W * 100}%"></span>` : '';
  }).join('');
  const nowLine = n > a && n < a + W ? `<i class="now" style="left:${(n - a) / W * 100}%"></i>` : '';
  return `<div class="tl" aria-hidden="true">${bars}${nowLine}</div>`;
}

function inView(p) {
  const n = nowStr(), today = n.slice(0, 10);
  if (state.view === 'now') return status(p).k !== 'off';
  if (state.view === 'today') return p.slots.some(s => inToday(s, n));
  const tm = addDays(today, 1);
  return p.slots.some(s => s.from.slice(0, 10) === tm);
}

// Σήμερα = όσα ξεκινούν σήμερα, συν όσα από χθες είναι ακόμα ανοιχτά
function inToday(s, n) { return s.from.slice(0, 10) === n.slice(0, 10) || (s.from <= n && n < s.to); }

// Σημείο αναφοράς για τις αποστάσεις: η θέση μου, αλλιώς το κέντρο του χάρτη
function ref() { if (state.me) return state.me; const c = map.getCenter(); return [c.lat, c.lng]; }
function sortKey(p) { return p.lat == null ? 1e9 : km(ref(), [p.lat, p.lng]); }

// Φαρμακεία που φαίνονται στον χάρτη τώρα (ή κοντά του)
const MIN_ZOOM_LIST = 9.5;
function nearby(list) {
  if (map.getZoom() < MIN_ZOOM_LIST) return null;
  const b = map.getBounds();
  const pad = 0.15 * (b.getNorth() - b.getSouth());
  const inB = p => p.lat != null && p.lat > b.getSouth() - pad && p.lat < b.getNorth() + pad && p.lng > b.getWest() - pad && p.lng < b.getEast() + pad;
  return list.filter(inB);
}
function placeName() {
  const r = ref();
  let best = null, bd = 1e9;
  for (const t of state.towns) { const d = km(r, t.c); if (d < bd) { bd = d; best = t; } }
  return best && bd < 25 ? best.n : '';
}

const MAX_ITEMS = 40;
function render() {
  renderList();
  // ό,τι πάτησες στον χάρτη φαίνεται πάντα, ανοιχτό στην κορυφή της λίστας
  const p = state.sel, box = $('list');
  if (p && !box.querySelector(`.item[data-id="${CSS.escape(p.id)}"]`)) {
    box.querySelector('.empty')?.remove();
    const el = card(p, status(p)); el.classList.add('on');
    box.prepend(el);
  }
}
function renderList() {
  const data = state.data; if (!data) return;
  const n = nowStr(), today = n.slice(0, 10), tm = addDays(today, 1);
  const list = $('list'); list.innerHTML = '';
  const all = data.pharmacies.filter(inView);
  const ph = nearby(all);
  $('live').hidden = state.view !== 'now';
  $('mode').hidden = !state.me || state.view !== 'now';
  document.querySelectorAll('#mode button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === mode));
  const where = placeName();
  paintMarkers(all);
  $('upd').textContent = data.updated ? data.updated.slice(8, 10) + '/' + data.updated.slice(5, 7) + ' ' + hhmm(data.updated) : '–';

  if (!ph) {
    $('big').textContent = all.filter(p => status(p).k === 'open').length + ' ανοιχτά σε όλη την Ελλάδα';
    $('small').textContent = 'Ψάξε πόλη ή πάτα το βελάκι';
    list.innerHTML = '<div class="empty"><b>Μεγάλωσε τον χάρτη σε μια πόλη</b>Ή γράψε το όνομα της πόλης στην αναζήτηση από πάνω.</div>';
    return;
  }

  if (state.view === 'now') {
    const rk = p => { const r = reach(p, status(p)); return r && !r.ok ? 1 : 0; };
    const open = ph.filter(p => status(p).k === 'open').sort((a, b) => rk(a) - rk(b) || sortKey(a) - sortKey(b));
    const later = ph.filter(p => status(p).k === 'later').sort((a, b) => status(a).inM - status(b).inM || sortKey(a) - sortKey(b));
    $('big').textContent = (open.length === 1 ? '1 ανοιχτό τώρα' : open.length + ' ανοιχτά τώρα');
    const near = open[0], d = near && dist(near), nr = near && reach(near, status(near));
    $('small').textContent = !open.length ? (later[0] ? 'Το επόμενο εδώ ανοίγει ' + hhmm(status(later[0]).slot.from) : 'Κανένα σε αυτό το σημείο του χάρτη')
      : nr ? (nr.ok ? `Προλαβαίνεις: ${short(near.name)} · φτάνεις σε ${nr.t}′` : 'Κανένα ανοιχτό εδώ δεν προλαβαίνεις · δες «Ανοίγουν αργότερα»')
      : d ? 'Πιο κοντινό: ' + short(near.name) + ' · ' + d.text : (where ? 'Στην περιοχή: ' + where + ' · πάτα το βελάκι για να δεις αν προλαβαίνεις' : 'Πάτα το βελάκι για να δεις αν προλαβαίνεις');
    open.slice(0, MAX_ITEMS).forEach(p => list.appendChild(card(p, status(p))));
    const regNear = nearby(state.reg) || [];
    if (regStatus().k === 'open' && regNear.length) {
      const g = document.createElement('p'); g.className = 'group'; g.textContent = 'Ανοιχτά με κανονικό ωράριο · ' + regNear.length; list.appendChild(g);
      regNear.sort((a, b) => rk(a) - rk(b) || sortKey(a) - sortKey(b)).slice(0, 25).forEach(p => list.appendChild(card(p, regStatus())));
      $('big').textContent = (open.length + regNear.length) + ' ανοιχτά τώρα';
      if (!d && !open.length) $('small').textContent = (where ? where + ': ' : '') + 'κανονικό ωράριο φαρμακείων';
    }
    if (later.length) {
      const g = document.createElement('p'); g.className = 'group'; g.textContent = 'Ανοίγουν αργότερα'; list.appendChild(g);
      later.slice(0, 12).forEach(p => list.appendChild(card(p, status(p))));
    }
    if (!open.length && !later.length && !(regStatus().k === 'open' && (nearby(state.reg) || []).length)) list.innerHTML = '<div class="empty"><b>Δεν βρέθηκαν φαρμακεία εδώ</b>Μίκρυνε λίγο τον χάρτη ή ψάξε άλλη πόλη.</div>';
  } else {
    const day = state.view === 'today' ? today : tm;
    $('big').textContent = dayName(day).replace(/^./, c => c.toUpperCase());
    const inDay = s => state.view === 'today' ? inToday(s, n) : s.from.slice(0, 10) === day;
    const duty = ph.filter(p => p.slots.some(s => s.type === 'duty' && inDay(s)));
    $('small').textContent = ph.length ? `${where ? where + ': ' : ''}${duty.length} εφημερεύουν · ${ph.length - duty.length} διευρυμένο` : '';
    if (!ph.length) {
      list.innerHTML = state.view === 'tomorrow'
        ? '<div class="empty"><b>Το πρόγραμμα της επόμενης μέρας δεν έχει βγει ακόμα</b>Θα εμφανιστεί εδώ μόλις το ανεβάσει ο Φαρμακευτικός Σύλλογος.</div>'
        : '<div class="empty"><b>Δεν βρέθηκαν φαρμακεία εδώ για σήμερα</b></div>';
    } else {
      const ticks = ['08', '12', '16', '20', '00', '04', '08'].map((t, i) => `<span style="left:${i / 6 * 100}%">${t}</span>`).join('');
      const tk = document.createElement('div'); tk.className = 'ticks'; tk.setAttribute('aria-hidden', 'true'); tk.innerHTML = ticks; list.appendChild(tk);
      const order = ph.slice().sort((a, b) => {
        const da = duty.includes(a), db = duty.includes(b); if (da !== db) return da ? -1 : 1;
        return sortKey(a) - sortKey(b); }).slice(0, MAX_ITEMS);
      let lastGroup = null;
      for (const p of order) {
        const g = duty.includes(p) ? 'Εφημερεύουν' : 'Διευρυμένο ωράριο';
        if (g !== lastGroup) { const h = document.createElement('p'); h.className = 'group'; h.textContent = g; list.appendChild(h); lastGroup = g; }
        const st = status(p);
        const slot = p.slots.filter(inDay);
        const shown = { ...st, slot: slot[slot.length - 1] };
        if (state.view === 'tomorrow') { shown.text = slot.map(slotLabel).join(', '); shown.color = 'var(--fg)'; }
        list.appendChild(card(p, shown, timeline(p, day)));
      }
    }
  }
}

// ---- χάρτης ----
let start = { center: [21.7346, 38.2466], zoom: 12.6 };
try { const v = JSON.parse(localStorage.getItem('view') || 'null'); if (v && v.center && v.zoom) start = v; } catch (e) {}
// ---- στυλ χάρτη (δοκιμή: ?dokimi στη διεύθυνση) ----
const OFM = 'https://tiles.openfreemap.org/styles/';
const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
const satellite = {
  version: 8, glyphs: 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
  sources: {
    sat: { type: 'raster', tileSize: 256, maxzoom: 19, attribution: 'Εικόνες © Esri, Maxar, Earthstar Geographics',
      tiles: [ESRI + 'World_Imagery/MapServer/tile/{z}/{y}/{x}'] },
    roads: { type: 'raster', tileSize: 256, maxzoom: 19, tiles: [ESRI + 'Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}'] },
    names: { type: 'raster', tileSize: 256, maxzoom: 19, tiles: [ESRI + 'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'] }
  },
  layers: [
    { id: 'sat', type: 'raster', source: 'sat' },
    { id: 'roads', type: 'raster', source: 'roads', paint: { 'raster-opacity': 0.75 } },
    { id: 'names', type: 'raster', source: 'names' }
  ]
};
const STYLES = {
  apalos: { name: 'Απαλός', url: () => OFM + (dark ? 'dark' : 'positron') },
  xromata: { name: 'Πολύχρωμος', url: () => OFM + 'liberty' },
  '3d': { name: '3D κτίρια', url: () => OFM + 'liberty', pitch: 55 },
  doryforos: { name: 'Δορυφόρος', url: () => satellite },
  nyxta: { name: 'Σκούρος', url: () => OFM + 'dark', glow: true }
};
const DOKIMI = /dokimi/.test(location.search + location.hash);
// Σχέδια σελίδας: το καθένα έχει και δικό του χάρτη
const DESIGNS = {
  old: { name: 'Τωρινό', map: null },
  clean: { name: 'Α · Καθαρό', map: 'xromata', stroke: '#ffffff' },
  dark: { name: 'Β · Σκούρο', map: 'nyxta', stroke: '#0B0C0E' },
  bold: { name: 'Γ · Έντονο', map: 'xromata', stroke: '#0A0A0A' }
};
let designKey = 'dark'; // το σχέδιο που διάλεξε ο Igli
function applyDesign() { if (designKey === 'old') document.documentElement.removeAttribute('data-d'); else document.documentElement.dataset.d = designKey; }
applyDesign();
let styleKey = DESIGNS[designKey].map || 'apalos';

const map = new maplibregl.Map({
  container: 'map', style: STYLES[styleKey].url(), pitch: STYLES[styleKey].pitch || 0, maxPitch: 70,
  center: start.center, zoom: start.zoom, attributionControl: { compact: true }, maxBounds: [[17.5, 33.8], [30.5, 42.5]], minZoom: 5.5
});
let mapReady = false;
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');

const COLORS = { open: '#07794D', later: '#A35400', off: '#7D8C85' };
function geojson(list) {
  return { type: 'FeatureCollection', features: list.filter(p => p.lat != null).map(p => {
    const st = status(p);
    return { type: 'Feature', id: p.n, geometry: { type: 'Point', coordinates: [p.lng, p.lat] }, properties: { i: p.n, k: st.k, sel: p === state.sel ? 1 : 0 } };
  }) };
}
let layerEvents = false;
function setupLayers() {
  const st = STYLES[styleKey];
  if (map.getLayer('building-3d')) map.setLayoutProperty('building-3d', 'visibility', st.pitch ? 'visible' : 'none');
  if (st.pitch && map.getLayer('building')) map.setLayoutProperty('building', 'visibility', 'none');
  for (const l of map.getStyle().layers) {
    if (l.type === 'symbol' && l.layout && l.layout['text-field']) {
      try { map.setLayoutProperty(l.id, 'text-field', ['coalesce', ['get', 'name:el'], ['get', 'name'], ['get', 'name_int']]); } catch (e) {}
    }
  }
  const img = new Image(48, 48);
  img.onload = () => { if (!map.hasImage('cross')) map.addImage('cross', img, { pixelRatio: 2 }); };
  img.src = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 18 18"><path d="M6.5 1h5v5.5H17v5h-5.5V17h-5v-5.5H1v-5h5.5z" fill="#fff" transform="translate(4.5 4.5) scale(.5)"/></svg>');
  map.addSource('reg', { type: 'geojson', data: regGeojson() });
  map.addLayer({ id: 'reg-dot', type: 'circle', source: 'reg', minzoom: 10,
    paint: { 'circle-radius': ['interpolate', ['linear'], ['zoom'], 10, 1.5, 14, 4, 17, 7],
      'circle-color': ['case', ['==', ['get', 'o'], 1], '#B4B8BE', '#6B6F76'],
      'circle-stroke-color': '#0B0C0E', 'circle-stroke-width': ['interpolate', ['linear'], ['zoom'], 12, 0, 15, 1] } });
  map.addSource('ph', { type: 'geojson', data: geojson([]) });
  map.addLayer({ id: 'ph-halo', type: 'circle', source: 'ph', filter: ['==', ['get', 'k'], 'open'],
    paint: { 'circle-radius': ['interpolate', ['linear'], ['zoom'], 6, STYLES[styleKey].glow ? 8 : 4, 12, STYLES[styleKey].glow ? 24 : 13, 16, STYLES[styleKey].glow ? 36 : 22],
      'circle-color': STYLES[styleKey].glow ? '#3DDC97' : '#12A464', 'circle-opacity': STYLES[styleKey].glow ? 0.35 : 0.22, 'circle-blur': STYLES[styleKey].glow ? 0.9 : 0 } });
  map.addLayer({ id: 'ph-dot', type: 'circle', source: 'ph',
    paint: {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 6, ['match', ['get', 'k'], 'off', 1.5, 2.5], 12, ['case', ['==', ['get', 'sel'], 1], 14, ['match', ['get', 'k'], 'off', 6, 9]], 16, ['case', ['==', ['get', 'sel'], 1], 20, ['match', ['get', 'k'], 'off', 9, 15]]],
      'circle-color': ['match', ['get', 'k'], 'open', COLORS.open, 'later', COLORS.later, COLORS.off],
      'circle-stroke-color': DESIGNS[designKey].stroke || '#ffffff', 'circle-stroke-width': ['interpolate', ['linear'], ['zoom'], 6, 0.5, 12, 2, 16, 2.5] } });
  map.addLayer({ id: 'ph-cross', type: 'symbol', source: 'ph', minzoom: 11.5,
    layout: { 'icon-image': 'cross', 'icon-size': ['interpolate', ['linear'], ['zoom'], 11.5, 0.45, 16, 0.85], 'icon-allow-overlap': true } });
  if (!layerEvents) { layerEvents = true; map.on('click', 'ph-dot', e => { const f = e.features && e.features[0]; if (f) { e.originalEvent.cancelBubble = true; clickedPin = true; select(byN[f.properties.i], false); } });
  map.on('mouseenter', 'ph-dot', () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', 'ph-dot', () => map.getCanvas().style.cursor = '');
  map.on('click', 'reg-dot', e => { const f = e.features && e.features[0]; if (f && !clickedPin) { clickedPin = true; select(state.reg[f.properties.i], false); } });
  map.on('mouseenter', 'reg-dot', () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', 'reg-dot', () => map.getCanvas().style.cursor = ''); }
  mapReady = true;
  render();
}
map.on('style.load', setupLayers);
function setStyleKey(k) {
  if (!STYLES[k] || k === styleKey) return;
  styleKey = k; mapReady = false;
  try { localStorage.setItem('style', k); } catch (e) {}
    map.setStyle(STYLES[k].url(), { diff: false });
  map.easeTo({ pitch: STYLES[k].pitch || 0, duration: 600 });
}

let byN = [], clickedPin = false;
function regGeojson() {
  const o = regStatus().k === 'open' ? 1 : 0;
  return { type: 'FeatureCollection', features: (state.reg || []).map((p, i) => ({ type: 'Feature', geometry: { type: 'Point', coordinates: [p.lng, p.lat] }, properties: { i, o } })) };
}
let regPainted = -1;
function paintMarkers(list) {
  const o = regStatus().k === 'open' ? 1 : 0;
  if (mapReady && map.getSource('reg') && (regPainted !== (state.reg || []).length * 2 + o)) { map.getSource('reg').setData(regGeojson()); regPainted = (state.reg || []).length * 2 + o; }
  if (!mapReady || !map.getSource('ph')) return;
  map.getSource('ph').setData(geojson(list));
}

function sheetH() { return innerWidth >= 860 ? 0 : $('sheet').getBoundingClientRect().height; }
function select(p, fromList) {
  state.sel = p; render();
  if (!p) return;
  if (p.lat != null) { moving = true; map.flyTo({ center: [p.lng, p.lat], zoom: Math.max(map.getZoom(), 15), offset: innerWidth >= 860 ? [210, 0] : [0, -sheetH() / 2 + 40], duration: 700 }); }
  const el = document.querySelector(`.item[data-id="${CSS.escape(p.id)}"]`);
  if (el && !fromList) { el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); if (innerWidth < 860) { $('sheet').classList.remove('low'); $('sheet').classList.add('tall'); } }
}
// Δείξε τα πιο κοντινά ανοιχτά φαρμακεία
function fitAll() {
  if (!state.data) return;
  const r = ref();
  const cand = state.data.pharmacies.filter(inView).filter(p => p.lat != null && (state.view !== 'now' || status(p).k === 'open'))
    .map(p => [km(r, [p.lat, p.lng]), p]).sort((a, b) => a[0] - b[0]).slice(0, 6).filter(x => x[0] < 40).map(x => [x[1].lng, x[1].lat]);
  if (state.me) cand.push([state.me[1], state.me[0]]);
  if (!cand.length) return;
  const b = cand.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(cand[0], cand[0]));
  const wide = innerWidth >= 860;
  map.fitBounds(b, { padding: { top: 140, bottom: wide ? 60 : sheetH() + 30, left: wide ? 440 : 40, right: 70 }, maxZoom: 15.5, duration: 600 });
}

// ---- θέση χρήστη ----
let meMarker = null;
function locate(fly) {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    state.me = [pos.coords.latitude, pos.coords.longitude];
    try { localStorage.setItem('loc-ok', '1'); } catch (e) {}
    if (!meMarker) { const d = document.createElement('div'); d.className = 'me'; meMarker = new maplibregl.Marker({ element: d }).setLngLat([state.me[1], state.me[0]]).addTo(map); }
    else meMarker.setLngLat([state.me[1], state.me[0]]);
    if (fly) { map.jumpTo({ center: [state.me[1], state.me[0]], zoom: Math.max(map.getZoom(), 13) }); fitAll(); }
    render();
  }, () => {}, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
}

// ---- δεδομένα: Πάτρα (κάθε 30') + όλη η Ελλάδα (3 φορές τη μέρα) ----
async function getJson(u) { const r = await fetch(u + '?t=' + Math.floor(Date.now() / 60000), { cache: 'no-store' }); if (!r.ok) throw new Error(r.status); return r.json(); }
async function load(first) {
  const [pa, gr, tw, al] = await Promise.allSettled([getJson('data/patra.json'), getJson('data/greece.json'), state.towns.length ? Promise.resolve(state.towns) : getJson('data/towns.json'), state.regRaw ? Promise.resolve(state.regRaw) : getJson('data/all.json')]);
  if (pa.status !== 'fulfilled' && gr.status !== 'fulfilled') {
    $('big').textContent = 'Δεν φόρτωσαν τα φαρμακεία';
    $('small').textContent = 'Έλεγξε τη σύνδεση και ξαναδοκίμασε.';
    return;
  }
  if (tw.status === 'fulfilled') state.towns = tw.value;
  const seen = new Set(), list = [];
  for (const p of (pa.value?.pharmacies || [])) { seen.add(p.id); list.push({ ...p, town: 'Πάτρα' }); }
  for (const p of (gr.value?.pharmacies || [])) if (!seen.has(p.id)) { seen.add(p.id); list.push(p); }
  list.forEach((p, i) => p.n = i);
  byN = list;
  if (al.status === 'fulfilled' && al.value?.items) {
    state.regRaw = al.value;
    const grid = new Map(); const key = (a, b) => Math.round(a * 1500) + ':' + Math.round(b * 1500);
    for (const p of list) if (p.lat != null) grid.set(key(p.lat, p.lng), 1);
    const near = (a, b) => { for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) if (grid.has((Math.round(a * 1500) + i) + ':' + (Math.round(b * 1500) + j))) return true; return false; };
    state.reg = al.value.items.filter(r => !near(r[0], r[1])).map((r, i) => ({ id: 'osm' + i, reg: true, lat: r[0], lng: r[1], name: r[2], address: r[3], town: r[4], zip: '', phone: r[5], oh: r[6], slots: [] }));
  }
  const ups = [pa.value?.updated, gr.value?.updated].filter(Boolean).sort();
  state.data = { pharmacies: list, updated: ups[ups.length - 1] };
  if (state.sel) state.sel = list.find(p => p.id === state.sel.id) || null;
  render();
  if (first && !localStorage.getItem('view')) { if (mapReady) fitAll(); else map.once('style.load', () => setTimeout(fitAll, 50)); }
}

function clock() { const d = new Date(); $('clock').textContent = d.toLocaleDateString('el-GR', { weekday: 'long', day: '2-digit', month: '2-digit', timeZone: 'Europe/Athens' }) + ' · ' + d.toLocaleTimeString('el-GR', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Europe/Athens' }); }

// ---- αναζήτηση πόλης ----
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/ς/g, 'σ');
function searchTowns() {
  const q = norm($('q').value.trim()), box = $('results');
  box.innerHTML = '';
  if (!q) { box.hidden = true; return; }
  const hits = state.towns.filter(t => norm(t.n).includes(q)).sort((a, b) => norm(a.n).indexOf(q) - norm(b.n).indexOf(q)).slice(0, 8);
  if (!hits.length) { box.innerHTML = '<p class="nores">Δεν βρέθηκε πόλη με αυτό το όνομα</p>'; box.hidden = false; return; }
  for (const t of hits) {
    const b = document.createElement('button'); b.type = 'button';
    b.innerHTML = '<b></b><span></span>';
    b.querySelector('b').textContent = t.n;
    b.querySelector('span').textContent = t.p.charAt(0) + t.p.slice(1).toLowerCase().replace(/ς$/, 'ς');
    b.onclick = () => { $('q').value = ''; box.hidden = true; $('q').blur(); state.sel = null; map.jumpTo({ center: [t.c[1], t.c[0]], zoom: 13 }); fitAllNear(t.c); };
    box.appendChild(b);
  }
  box.hidden = false;
}
function fitAllNear(c) { const keep = state.me; state.me = null; map.jumpTo({ center: [c[1], c[0]], zoom: 13 }); fitAll(); state.me = keep; render(); }
$('q').addEventListener('input', searchTowns);
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { const f = $('results').querySelector('button'); if (f) f.click(); } if (e.key === 'Escape') { $('q').value = ''; searchTowns(); } });
$('search').addEventListener('submit', e => e.preventDefault());

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  state.view = b.dataset.view; state.sel = null;
  document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', x === b));
  $('scroll').scrollTop = 0; render();
});
$('locate').onclick = () => locate(true);
document.querySelectorAll('#mode button').forEach(b => b.onclick = () => { mode = b.dataset.m; try { localStorage.setItem('mode', mode); } catch (e) {} render(); });
$('fit').onclick = fitAll;
// Σύρσιμο της λίστας πάνω/κάτω με το δάχτυλο (κινητό): 3 θέσεις — χαμηλά, μέση, ψηλά
(() => {
  const sh = $('sheet'), zones = [$('handle'), document.querySelector('#sheet .head')];
  let y0 = 0, h0 = 0, dragging = false, moved = false, lastY = 0, lastT = 0, vel = 0;
  const snaps = () => [Math.min(175, innerHeight * .3), Math.max(300, innerHeight * .46), innerHeight * .82];
  const setState = s => { sh.classList.toggle('low', s === 0); sh.classList.toggle('tall', s === 2); };
  const cur = () => sh.classList.contains('tall') ? 2 : sh.classList.contains('low') ? 0 : 1;
  const down = e => {
    if (innerWidth >= 860 || (e.pointerType === 'mouse' && e.button !== 0)) return;
    if (e.target.closest('input,.results')) return;
    dragging = true; moved = false; y0 = lastY = e.clientY; lastT = performance.now(); vel = 0;
    h0 = sh.getBoundingClientRect().height;
  };
  const move = e => {
    if (!dragging) return;
    const dy = e.clientY - y0;
    if (!moved && Math.abs(dy) < 6) return;
    if (!moved) { moved = true; sh.style.transition = 'none'; sh.style.minHeight = '0'; }
    const t = performance.now(); vel = (e.clientY - lastY) / Math.max(1, t - lastT); lastY = e.clientY; lastT = t;
    sh.style.height = Math.max(120, Math.min(innerHeight * .9, h0 - dy)) + 'px';
    e.preventDefault();
  };
  const up = () => {
    if (!dragging) return; dragging = false;
    if (!moved) return;
    const h = sh.getBoundingClientRect().height, s = snaps();
    let i = s.reduce((b, v, k) => Math.abs(v - h) < Math.abs(s[b] - h) ? k : b, 0);
    if (vel < -0.5) i = Math.min(2, cur() + 1 > i ? cur() + 1 : i);   // γρήγορο σπρώξιμο πάνω
    if (vel > 0.5) i = Math.max(0, cur() - 1 < i ? cur() - 1 : i);    // γρήγορο σπρώξιμο κάτω
    sh.style.transition = ''; sh.style.height = ''; sh.style.minHeight = '';
    setState(i);
    const stop = ev => { ev.stopPropagation(); ev.preventDefault(); };
    addEventListener('click', stop, { capture: true, once: true });   // να μη «πατηθεί» κουμπί μετά το σύρσιμο
    setTimeout(() => removeEventListener('click', stop, { capture: true }), 50);
  };
  zones.forEach(z => z && z.addEventListener('pointerdown', down));
  addEventListener('pointermove', move, { passive: false });
  addEventListener('pointerup', up); addEventListener('pointercancel', up);
  $('handle').onclick = () => { const c = cur(); setState(c === 2 ? 1 : c + 1); };
})();
map.on('click', () => { if (clickedPin) { clickedPin = false; return; } if (state.sel) select(null); });
let moving = false, mvT = null;
map.on('moveend', () => {
  clearTimeout(mvT);
  mvT = setTimeout(() => {
    try { const c = map.getCenter(); localStorage.setItem('view', JSON.stringify({ center: [+c.lng.toFixed(4), +c.lat.toFixed(4)], zoom: +map.getZoom().toFixed(1) })); } catch (e) {}
    if (moving) { moving = false; return; }
    render();
  }, 150);
});

state.towns = [];
clock(); load(true);
try { if (localStorage.getItem('loc-ok')) locate(!localStorage.getItem('view')); } catch (e) {}
setInterval(() => { clock(); render(); }, 30000);
setInterval(() => load(false), 10 * 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { clock(); load(false); } });
</script>
</body>
